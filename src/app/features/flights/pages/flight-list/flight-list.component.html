<h1>Flights</h1>

@if(loading()){

<p>Cargando...</p>

} @else if (errorMessage()){

<p>{{errorMessage()}}</p>

}

@else if (flights().length === 0) {

<p>No hay vuelos</p>

} @else {

@for (flight of flights(); track flight._id) {

<app-flight-card [flight]="flight" (onDelete)="delete($event)">
</app-flight-card>

}

}
